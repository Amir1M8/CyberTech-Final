<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../css/login.css">
    <title>ورود</title>
    <link rel="shortcut icon" href="../../assets/images/Logo.ico"/>
    <style>
        .image-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;    
            height: 100vh;   
            overflow: hidden;
            z-index: -1;     
        }
        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(6px);
        }
        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(8px) brightness(0.85);
            transform: scale(1.05);
        }
    </style>
    <script src="../../js/functions.js"></script>
</head>
<body>
    <div class="image-wrapper">
        <img src="../../assets/images/image4.jpg" alt="login-background">
    </div>

    <div class="message-card" id="message-card" hidden="true">
        <p id="message" class="message"></p>
        <script>
            if (location.search.replace("?status=","") == "success") {
                document.getElementById("message-card").hidden = false;
                document.getElementById("message").innerText = "حساب کاربر ساخته شد، وارد حساب خود شوید";
                document.getElementById("message").style = "background-color: rgba(22, 119, 11, 0.732);";
            } else if (location.search.replace("?status=","") == "exist") {
                document.getElementById("message-card").hidden = false;
                document.getElementById("message").innerText = "حساب کاربری قبلا وجود داشته است";
                document.getElementById("message").style = "background-color: rgba(153, 16, 16, 0.732);";
            } else if (location.search.replace("?status=","") == "invalid") {
                document.getElementById("message-card").hidden = false;
                document.getElementById("message").innerText = "ایمیل یا رمز عبور اشتباه است";
                document.getElementById("message").style = "background-color: rgba(153, 16, 16, 0.732);";
            }
        </script>
    </div>
    <div class="card">
        <p id="title" class="title"><b>به آکادمی ما خوش آمدید</b></p>
        <form class="form" action="../../php/database/login.php" method="post">
            <input type="hidden" name="lang" value="fa">
            <input type="email" placeholder="ایمیل" class="input" name="email">
            <input type="password" placeholder="رمز عبور" class="input" name="password">
            <input class="login-button" type="submit" value="ورود">
        </form>
        
        <p class="home">
            برگشت به
            <span class="home-page" onclick="redirect('../../php/fa/index.php')">خانه</span>
        </p>
        <p class="signup">
            حساب کاربری ندارید؟  
            <span class="signup-page" onclick="redirect('./register.html')">ثبت نام</span>
        </p>
        <p class="forgot">
            <span class="forgot-page" onclick="redirect('./forget.html')">فراموشی رمز عبور</span>
        </p>
    </div>
    <script>
        document.body.style = "direction: rtl;margin: 0;font-family: 'Vazirmatn', sans-serif;";
        document.getElementsByClassName("login-button")[0].style = "margin-top: 10%;";
    </script>
</body>
</html>
